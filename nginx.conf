server {
    listen 5001;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=30s;

    # SPA — all routes return index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to NestJS (host.docker.internal = host machine)
    location /api/ {
        set $backend http://host.docker.internal:3000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Static assets cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
